services:
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - model:/root/.ollama
    mem_limit: 6g
    healthcheck:
      test: [CMD, /bin/ollama, list]
      interval: 3s
      timeout: 5s
      retries: 30
  model-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, qwen3.5:4b]
    depends_on:
      ollama:
        condition: service_healthy
  app:
    environment:
      MODEL_PROVIDER: ollama
      MODEL_BASE_URL: http://ollama:11434
      MODEL_NAME: qwen3.5:4b
      MODEL_CPU_ONLY: "true"
      MODEL_KEEP_ALIVE_SECONDS: "300"
      MODEL_DATA_POLICY: internal
      ALLOW_EXTERNAL_MODEL: "false"
    depends_on:
      model-init:
        condition: service_completed_successfully
volumes:
  model:
